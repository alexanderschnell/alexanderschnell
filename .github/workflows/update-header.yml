name: Update header

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build-header.ps1]

permissions:
  contents: write

concurrency:
  group: update-header
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main, not the triggering commit, so queued runs never push stale history

      - name: Rebuild header (date, job number, uptime, contributions)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build-header.ps1

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh header ($(date -u +%Y-%m-%d))"
            git push
          fi
